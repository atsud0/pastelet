[package]
name = "pastelet"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ammonia = "4"
argon2 = "0.5.3"
askama = "0.16"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
getrandom = "0.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
syntect = { version = "5.3", default-features = false, features = ["default-onig"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
two-face = "0.5"
url = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
