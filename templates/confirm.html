{% extends "base.html" %}
{% block title %}Burn · rpaste{% endblock %}
{% block content %}
<div class="flex min-h-[60vh] flex-col items-center justify-center">
  <div class="state-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2c2 7-5 7-3 12 2 0 4-2 4-5 6 5 6 12-2 13C3 21 2 14 7 9c-1 4 1 5 1 5-1-6 4-7 5-12Z"/></svg></div>
  <h1 class="mb-6 flex items-center gap-2 text-2xl font-semibold">Burn <span tabindex="0" data-tooltip="Deleted after viewing" aria-label="Deleted after viewing"><svg class="size-4" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/></svg></span></h1>
  <form action="/read/{{ id }}" method="post">
    <input type="hidden" name="target" value="{{ target }}">
    <input type="hidden" name="token" value="{{ token }}">
    <button class="primary" type="submit">View</button>
  </form>
</div>
{% endblock %}
